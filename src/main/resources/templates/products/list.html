<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Product List</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        table { border-collapse: collapse; width: 100%; max-width: 700px; }
        th, td { border: 1px solid #ccc; padding: 8px 12px; text-align: left; }
        th { background-color: #f4f4f4; }
        a.button {
            display: inline-block; padding: 6px 12px; margin-right: 6px;
            background-color: #4CAF50; color: white; text-decoration: none; border-radius: 4px;
        }
        a.button.delete { background-color: #e53935; }
        a.button.add { margin-bottom: 20px; background-color: #2196F3; }
    </style>
</head>
<body>

<h1>Products</h1>

<a class="button add" th:href="@{/products/new}">+ Add New Product</a>

<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Price</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="product : ${products}">
            <td th:text="${product.id}">1</td>
            <td th:text="${product.name}">Sample Name</td>
            <td th:text="${product.price}">0.00</td>
            <td>
                <a class="button" th:href="@{/products/edit/{id}(id=${product.id})}">Edit</a>
                <a class="button delete" th:href="@{/products/delete/{id}(id=${product.id})}"
                   onclick="return confirm('Delete this product?');">Delete</a>
            </td>
        </tr>
    </tbody>
</table>

</body>
</html>
