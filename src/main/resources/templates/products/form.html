<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${product.id} != null ? 'Edit Product' : 'New Product'">Product Form</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        form { max-width: 400px; }
        label { display: block; margin-top: 12px; font-weight: bold; }
        input[type=text], input[type=number] {
            width: 100%; padding: 6px; margin-top: 4px; box-sizing: border-box;
        }
        button {
            margin-top: 20px; padding: 8px 16px; background-color: #4CAF50;
            color: white; border: none; border-radius: 4px; cursor: pointer;
        }
        a { display: inline-block; margin-top: 20px; margin-left: 10px; }
    </style>
</head>
<body>

<h1 th:text="${product.id} != null ? 'Edit Product' : 'New Product'">Product Form</h1>

<form th:action="@{/products/save}" th:object="${product}" method="post">
    <!-- hidden id field: empty for new products, populated for edits -->
    <input type="hidden" th:field="*{id}" />

    <label for="name">Name</label>
    <input type="text" id="name" th:field="*{name}" required />

    <label for="price">Price</label>
    <input type="number" step="0.01" id="price" th:field="*{price}" required />

    <button type="submit">Save</button>
    <a th:href="@{/products}">Cancel</a>
</form>

</body>
</html>
